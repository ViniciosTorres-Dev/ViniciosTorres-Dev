<svg xmlns="http://www.w3.org/2000/svg" width="850" height="180" viewBox="0 0 850 180">
  <defs>
    <style>
      .metric-icon { animation: count-glow 4s ease-in-out infinite; }
      @keyframes count-glow { 0%, 100% { fill-opacity: 0.7; } 50% { fill-opacity: 1; } }
    </style>
    <filter id="num-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="849" height="179" rx="12" ry="12" fill="#0f1623" stroke="#1a2332" stroke-width="1"/>
  <text x="30" y="38" fill="#64748b" font-size="11" font-family="monospace" letter-spacing="3">Profile History</text>
  <line x1="170.0" y1="55" x2="170.0" y2="155" stroke="#1a2332" stroke-width="1" opacity="0.5"/>
  <line x1="340.0" y1="55" x2="340.0" y2="155" stroke="#1a2332" stroke-width="1" opacity="0.5"/>
  <line x1="510.0" y1="55" x2="510.0" y2="155" stroke="#1a2332" stroke-width="1" opacity="0.5"/>
  <line x1="680.0" y1="55" x2="680.0" y2="155" stroke="#1a2332" stroke-width="1" opacity="0.5"/>

  <g class="metric-cell" transform="translate(85.0, 95)">
      <text x="0" y="2" text-anchor="middle" fill="#00d4ff" font-size="28" font-weight="bold" font-family="sans-serif" opacity="0.35" filter="url(#num-glow)">{COMMITS}</text>
      <text x="0" y="2" text-anchor="middle" fill="#f1f5f9" font-size="28" font-weight="bold" font-family="sans-serif">{COMMITS}</text>
      <text x="0" y="20" text-anchor="middle" fill="#64748b" font-size="11" font-family="monospace" letter-spacing="1">Commits</text>
  </g>
  <g class="metric-cell" transform="translate(255.0, 95)">
      <text x="0" y="2" text-anchor="middle" fill="#ffb020" font-size="28" font-weight="bold" font-family="sans-serif" opacity="0.35" filter="url(#num-glow)">{STARS}</text>
      <text x="0" y="2" text-anchor="middle" fill="#f1f5f9" font-size="28" font-weight="bold" font-family="sans-serif">{STARS}</text>
      <text x="0" y="20" text-anchor="middle" fill="#64748b" font-size="11" font-family="monospace" letter-spacing="1">Stars</text>
  </g>
  <g class="metric-cell" transform="translate(425.0, 95)">
      <text x="0" y="2" text-anchor="middle" fill="#a78bfa" font-size="28" font-weight="bold" font-family="sans-serif" opacity="0.35" filter="url(#num-glow)">{PRS}</text>
      <text x="0" y="2" text-anchor="middle" fill="#f1f5f9" font-size="28" font-weight="bold" font-family="sans-serif">{PRS}</text>
      <text x="0" y="20" text-anchor="middle" fill="#64748b" font-size="11" font-family="monospace" letter-spacing="1">PRs</text>
  </g>
  <g class="metric-cell" transform="translate(595.0, 95)">
      <text x="0" y="2" text-anchor="middle" fill="#00d4ff" font-size="28" font-weight="bold" font-family="sans-serif" opacity="0.35" filter="url(#num-glow)">{ISSUES}</text>
      <text x="0" y="2" text-anchor="middle" fill="#f1f5f9" font-size="28" font-weight="bold" font-family="sans-serif">{ISSUES}</text>
      <text x="0" y="20" text-anchor="middle" fill="#64748b" font-size="11" font-family="monospace" letter-spacing="1">Issues</text>
  </g>
  <g class="metric-cell" transform="translate(765.0, 95)">
      <text x="0" y="2" text-anchor="middle" fill="#a78bfa" font-size="28" font-weight="bold" font-family="sans-serif" opacity="0.35" filter="url(#num-glow)">{REPOS}</text>
      <text x="0" y="2" text-anchor="middle" fill="#f1f5f9" font-size="28" font-weight="bold" font-family="sans-serif">{REPOS}</text>
      <text x="0" y="20" text-anchor="middle" fill="#64748b" font-size="11" font-family="monospace" letter-spacing="1">Repos</text>
  </g>
</svg>
